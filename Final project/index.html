<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>
      .navbar{
        background-color: #1f2937;
        padding: 12px 25px;
      }
      .navbar-brand{
        color: white !important;
        font-size: 22px;
        font-weight: 600;
      }
      .navbar .nav-link{
        color:#e5e7eb !important;
        font-size: 16px;
        margin-left: 15px;
        transition: 0.3s;
      }
      .navbar .nav-link:hover{
        color: #38bdf8 !important;

      }
      .navbar .navlink.active{
        color:#38bdf8 !important;
      }
      .carousel{
        width: 100;
        height: calc(100vh-65px);
        overflow: hidden;
      }
      
/* Each slide */
      .carousel-item{
        height:calc(100vh-65px);
        position: relative;
      }
      /* Images */
      .carousel-item img{
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;

      }
      /* Dark overlay on images */
      .carousel-item::after{
        content:"";
        position:absolute;
        inset:0;
        background: rgba(0,0,0,0.35);

      }
      /* Caption */
      .carousel-cation{
        z-index: 2;
        bottom: 25%;
        text-align: center;

      }
      /* Heading */
      .carousel-cation h5{
        font-size: 50px;
        font-weight: 700;
        color: white;
        text-transform: uppercase;
        letter-spacing: 3px;
        text-shadow: 2px 2px 8px black;
      }
      /* Paragraph */
      .carousel-cation p{
        font-size: 20px;
        color:white;
        text-shadow:1px 1px 5px black;
      }
      /* Indicators */
      .carousel-indicators{
        z-index: 3;

      }
      .carousel-indicators button{
        width: 35px;
        height: 4px;
        margin:0 5px;
      }
      /* Previous / Next buttons */
      .carousel-control-prev,.carousel-control-next{
        z-index: 3;
        width: 8%;
      }
      /* Hover effect on controls */
      .carousel-control-prev:hover,
      .carousel-control-next:hover{
        background: rgba(0,0,0,0.15);
      }
    </style>
  </head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary bg -dark" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Navbar</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav" bg="dark"text="light">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="about.html">About US</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="crypto.html">Top 100 CRYPTOCOINS</a>
        </li>
      </ul>
    </div>
  </div>
</nav>




   <div id="carouselExampleDark" class="carousel carousel-dark slide">
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="2" aria-label="Slide 3"></button>
  </div>
  <div class="carousel-inner" data-bs-interval="2000">
    <div class="carousel-item active" data-bs-interval="10000">
      <img src="https://images.pexels.com/photos/6764230/pexels-photo-6764230.jpeg" class="d-block w-100" alt="..." >
      <div class="carousel-caption d-none d-md-block">
        <h5>Explore The Future Of Crypto</h5>
        <p>Discover the world of cryptocurrency and digital assets.</p>
      </div>
    </div>
    <div class="carousel-item" data-bs-interval="2000">
      <img src="https://images.pexels.com/photos/8369829/pexels-photo-8369829.jpeg" class="d-block w-100" alt="...">
      <div class="carousel-caption d-none d-md-block">
        <h5>Trade Smarter</h5>
        <p>Track cryptocurrency prices and stay updated with the market.</p>
      </div>
    </div>
    <div class="carousel-item" data-bs-interval="2000">
      <img src="https://images.pexels.com/photos/5980896/pexels-photo-5980896.jpeg" class="d-block w-100" alt="...">
      <div class="carousel-caption d-none d-md-block">
        <h5>Build Your Crypto Portfolio</h5>
        <p>Explore the top cryptocurrencies in the market.</p>
      </div>
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
</div>
