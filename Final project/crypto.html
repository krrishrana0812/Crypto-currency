<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<style>
  .navbar{
        background-color: #1f2937;
        padding: 12px 25px;
      }
      .navbar-brand{
        color: white !important;
        font-size: 22px;
        font-weight: 600;
      }
      .navbar .nav-link{
        color:#e5e7eb !important;
        font-size: 16px;
        margin-left: 15px;
        transition: 0.3s;
      }
      .navbar .nav-link:hover{
        color: #38bdf8 !important;

      }
      .navbar .navlink.active{
        color:#38bdf8 !important;
      }
      .carousel{
        width: 100;
        height: calc(100vh-65px);
        overflow: hidden;
      }
      
/* Page title*/
.container{
  margin-top: 50px;

}
.container h1{
  font-size: 45px;
  font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 40px;
}
.container h1::after{
  content: "";
  display: block;
  width: 80px;
  height: 4px;
  background-color: #38bdf8;
  margin: 15px auto 0;
  border-radius: 5px;
}
/* Table */
.table{
  background-color: #1f2937;
  color: white;
  border-radius: 10px;
  overflow: hidden;
  vertical-align: middle;

}
/* Table heading*/
.table thead th{
  background-color: #374151;
  color: #38bdf8;
  font-size: 15px;
  padding: 16px;
  white-space: nowrap;
}
/* table rows */
.table tbody td{
  background-color: #1f2937;
  color: #e5e7eb;
  padding: 12px 16px;
  border-color: #374151;
}
/* Hover*/
.table-hover tbody tr:hover td{
  background-color: #374151;
  color: white;
}
/*Crypto currency images*/
.table tbody td img{
  width: 40px;
  height: 40px;
  object-fit: contain;
  vertical-align: middle;
  margin-right: 10px;
}
/*Rank column*/
.table tbody td:first-child{
  font-weight: bold;
  color: #38bdf8;
}
/*Responsive table*/
.table-responsive{
  border-radius: 10px;
}
/*for mobile*/
@media(max-width:768px){
  .container h1{
    font-size: 32px;

  }
  .navbar{
    padding: 10px 15px;

  }
  .table thead th{
    font-size: 13px;
  }
  .table tbody td{
    font-size: 13px;
  }
}
</style>
    <title>Document</title>
  </head>
  <body>
<nav class="navbar navbar-expand-lg bg-body-tertiary bg -dark" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Navbar</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav" bg="dark"text="light">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="about.html">About US</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="crypto.html">Top 100 CRYPTOCOINS</a>
        </li>
      </ul>
    </div>
  </div>
</nav>


    <div class="container">
      <h1 class="text-center">TOP 100 Cryptocurrencies</h1>
    <table class="table table-striped table-hover" >
      <thead>
        <th>Rank</th>
        <th>Name</th>
        <th>Current Price</th>
        <th>High 24h</th>
        <th>Low 24h</th>
        <th>Price change 24h</th>
        
        <th>Price Change 24h (%)</th>
        <th>Total Volume</th>
      </thead>
      <tbody id="crypto">

      </tbody>
    </table>
</div>
    <script>
      async function Fetchcrypto() {
        let data = await (
          await fetch(
            "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&sparkline=false "
          )
        ).json();
        console.log(data);
        for (let i = 0; i < data.length; i++) {
          document.getElementById("crypto").innerHTML += `       
                <tr>         
                    <td>${i + 1}</td>
                    <td><img src=${data[i].image} height="100"> ${data[i].name}</td>
                    <td>$${data[i].current_price.toLocaleString()}</td>
                   <td>$${data[i].high_24h.toLocaleString()}</td>
                    <td>$${data[i].low_24h.toLocaleString()}</td>
                    <td>$${data[i].price_change_24h.toFixed(2)}</td>
                    <td>${data[i].price_change_percentage_24h.toFixed(2)}%</td>
                    <td>$${data[i].total_volume.toLocaleString()}</td>


                </tr>
                `;
        }
      }

      Fetchcrypto();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

  </body>
</html>
